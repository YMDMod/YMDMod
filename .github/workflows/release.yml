name: Release archive

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Build archive
        run: |
          name="ymdmod-${GITHUB_REF_NAME#v}.zip"
          zip -r "$name" core installer ymdmod.ps1 install.ps1 uninstall.ps1 package.json LICENSE -x 'core/test/*'
          sha256sum "$name" > "$name.sha256"
      - name: Attach to the release
        run: gh release upload "$GITHUB_REF_NAME" ymdmod-*.zip ymdmod-*.zip.sha256 --clobber
        env:
          GH_TOKEN: ${{ github.token }}
